# =============================================================================
# Multi-Agent Orchestrator — CI Pipeline
# =============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile-check all .py files
        run: |
          echo "=== Checking Python syntax ==="
          find . -name "*.py" -not -path "./.venv/*" -not -path "./.git/*" | while read f; do
            python -c "import py_compile; py_compile.compile('$f', doraise=True)" || exit 1
          done
          echo "All Python files pass syntax check"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No test files found in tests/ — skipping"
          fi
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: multi-agent-orchestrator:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
